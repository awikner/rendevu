name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into frontend
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          RENDEVU_CLIENT_TOKEN: ${{ secrets.RENDEVU_CLIENT_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os
          path = "frontend/js/search.js"
          with open(path) as f:
              src = f.read()
          src = src.replace("RENDER_BACKEND_URL_PLACEHOLDER", os.environ["RENDER_BACKEND_URL"])
          src = src.replace("RENDEVU_CLIENT_TOKEN_PLACEHOLDER", os.environ["RENDEVU_CLIENT_TOKEN"])
          with open(path, "w") as f:
              f.write(src)
          PYEOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
